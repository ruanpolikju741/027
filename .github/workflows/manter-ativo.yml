# Mantém o plano gratuito do Supabase ativo: projeto gratuito sem nenhum acesso por 7 dias é
# pausado. A cada 2 dias isto chama /api/saude do app (que consulta o banco), o que conta como uso.
# Configure uma vez: no GitHub, Settings → Secrets and variables → Actions → aba "Variables" →
# New repository variable → nome URL_APP, valor = endereço do app (ex.: https://controle-estoque-xxxx.onrender.com)
name: Manter ativo

on:
  schedule:
    - cron: "17 11 */2 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o app
        env:
          URL_APP: ${{ vars.URL_APP }}
        run: |
          if [ -z "$URL_APP" ]; then
            echo "::notice::Variável URL_APP ainda não configurada — nada a fazer (veja o README)."
            exit 0
          fi
          # O Render gratuito pode levar ~1 minuto pra acordar.
          curl --fail --silent --show-error --max-time 150 --retry 3 --retry-delay 20 --retry-all-errors \
            "${URL_APP%/}/api/saude"
